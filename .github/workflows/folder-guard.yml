# Passes when, for every area a pull request touches, the author owns that area or one of
# its owners has approved the pull request. Areas: each publication folder listed in
# .github/CODEOWNERS, and "*" for everything else (top-level files, unlisted folders).
# CODEOWNERS is read from the base branch, so a pull request cannot grant itself ownership.
name: folder-guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  folder-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const author = pr.user.login.toLowerCase();

            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path: '.github/CODEOWNERS', ref: pr.base.sha });
            const owners = {};                       // area -> [logins]
            for (const raw of Buffer.from(file.content, 'base64').toString().split('\n')) {
              const line = raw.trim();
              if (!line || line.startsWith('#')) continue;
              const m = line.match(/^((?:\\ |\S)+)\s+(.+)$/);
              if (!m) continue;
              const area = m[1] === '*' ? '*' : m[1].replace(/\\ /g, ' ').replace(/^\/|\/$/g, '');
              owners[area] = m[2].split(/\s+/).filter(o => o.startsWith('@'))
                                 .map(o => o.slice(1).toLowerCase());
            }

            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const areas = new Set();
            for (const f of files) {
              for (const path of [f.filename, f.previous_filename].filter(Boolean)) {
                const top = path.includes('/') ? path.split('/')[0] : null;
                areas.add(top && top in owners ? top : '*');
              }
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews,
              { owner, repo, pull_number: pr.number, per_page: 100 });
            const latest = {};
            for (const r of reviews) {
              if (r.state !== 'COMMENTED') latest[r.user.login.toLowerCase()] = r.state;
            }
            const approvers = Object.keys(latest).filter(u => latest[u] === 'APPROVED');

            const missing = [];
            for (const area of areas) {
              const o = owners[area] || [];
              const ok = o.includes(author) || o.some(u => approvers.includes(u));
              core.info(`${ok ? 'ok     ' : 'BLOCKED'} ${area === '*' ? 'top-level files' : area}`
                        + `  (owners: ${o.join(', ') || 'none'})`);
              if (!ok) missing.push(`${area === '*' ? 'top-level files' : area} -> ${o.join(', ') || 'no owner listed'}`);
            }
            if (missing.length) {
              core.setFailed('Needs an approving review from an owner of:\n  ' + missing.join('\n  '));
            }
